[project]
name = "clarify-cli"
version = "0.1.0"
description = "Command-line interface for the Clarify CRM API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saul Dugan" }]
requires-python = ">=3.11"
keywords = ["clarify", "crm", "cli", "api", "jsonapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15,<1",
    "httpx>=0.27,<1",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/sdugan05/clarify-cli"
Repository = "https://github.com/sdugan05/clarify-cli"
Issues = "https://github.com/sdugan05/clarify-cli/issues"
"Clarify API docs" = "https://developer.clarify.ai/docs"

[project.scripts]
clarify = "clarify_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # typer.Option() in argument defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:clarify_cli.*"]
